<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CsPsc Playground</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <!-- Left Pane: Monaco Editor -->
      <div class="left-pane">
        <div class="editor-header">
          <h2>CsPsc Playground</h2>
          <button id="compileBtn" class="compile-btn">Compile</button>
        </div>
        <div id="editor"></div>
      </div>

      <!-- Resizer -->
      <div class="resizer"></div>

      <!-- Right Pane: Tabs -->
      <div class="right-pane">
        <div class="tabs">
          <button class="tab-btn active" data-tab="result">Compile Result</button>
          <button class="tab-btn" data-tab="pdf">PDF Output</button>
        </div>
        <div class="tab-content">
          <div id="result-tab" class="tab-panel active">
            <pre id="output">Ready to compile...</pre>
          </div>
          <div id="pdf-tab" class="tab-panel">
            <embed id="pdf-viewer" type="application/pdf" width="100%" height="100%" />
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="main.ts"></script>
  </body>
</html>
